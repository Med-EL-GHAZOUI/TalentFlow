<div class="overlay animate-fade-in" style="position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(15, 23, 42, 0.4); backdrop-filter: blur(8px); z-index: 1000; display: flex; align-items: center; justify-content: center;">

  <div class="glass-card animate-slide-up" style="width: 400px; padding: 2rem; text-align: center; border: 1px solid rgba(255, 255, 255, 0.5); box-shadow: 0 20px 40px rgba(0, 0, 0, 0.2);">
    
    <div class="icon-container" style="width: 64px; height: 64px; border-radius: 50%; background: rgba(239, 68, 68, 0.1); color: var(--rose-500); display: flex; align-items: center; justify-content: center; margin: 0 auto 1.5rem auto;">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" width="32" height="32">
        <path d="M10.29 3.86L1.82 18a2 2 0 0 0 1.71 3h16.94a2 2 0 0 0 1.71-3L13.71 3.86a2 2 0 0 0-3.42 0z"></path>
        <line x1="12" y1="9" x2="12" y2="13"></line>
        <line x1="12" y1="17" x2="12.01" y2="17"></line>
      </svg>
    </div>

    <h2 style="font-size: 1.25rem; font-weight: 800; color: var(--slate-800); margin-bottom: 0.75rem;">{{ title }}</h2>

    <p style="color: var(--slate-500); font-size: 0.95rem; margin-bottom: 2rem;">{{ message }}</p>

    <div class="actions" style="display: flex; gap: 1rem; justify-content: center;">
      <button class="glass-icon-btn" (click)="onCancel()" style="width: auto; padding: 0 1.5rem; font-weight: 600;">
        Annuler
      </button>

      <button class="btn-premium" (click)="onConfirm()" style="background: linear-gradient(135deg, var(--rose-500), var(--rose-600)); border: none;">
        <span class="btn-glow" style="background: var(--rose-400);"></span>
        <span class="btn-content">Confirmer</span>
      </button>
    </div>

  </div>

</div>
