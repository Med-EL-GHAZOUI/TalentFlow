<div class="login-card">

  <h2>Connexion</h2>

  <form (ngSubmit)="login()">

    <input
      type="email"
      placeholder="Email"
      [(ngModel)]="credentials.email"
      name="email">

    <input
      type="password"
      placeholder="Mot de passe"
      [(ngModel)]="credentials.password"
      name="password">

    <button type="submit">

      Se connecter

    </button>

  </form>

</div>
