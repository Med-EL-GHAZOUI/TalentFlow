<div class="page-header animate-fade-in">
  <div>
    <h1 class="page-title">Nouvel Employé</h1>
    <p class="page-subtitle">Ajouter un nouveau membre à l'équipe</p>
  </div>
  <div class="header-actions">
    <button class="btn btn-secondary" routerLink="/employees">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" width="18" height="18">
        <line x1="19" y1="12" x2="5" y2="12"></line>
        <polyline points="12 19 5 12 12 5"></polyline>
      </svg>
      Retour
    </button>
  </div>
</div>

<div class="card animate-slide-up">
  <form (ngSubmit)="save()" class="form-layout">
    
    <div class="form-section">
      <h3 class="section-title">Informations Personnelles</h3>
      
      <div class="form-grid">
        <div class="form-group">
          <label class="form-label">Prénom</label>
          <input type="text" class="form-control" [(ngModel)]="employee.firstname" name="firstname" placeholder="Ex: Jean">
        </div>
        
        <div class="form-group">
          <label class="form-label">Nom</label>
          <input type="text" class="form-control" [(ngModel)]="employee.lastname" name="lastname" placeholder="Ex: Dupont">
        </div>
        
        <div class="form-group">
          <label class="form-label">Email</label>
          <input type="email" class="form-control" [(ngModel)]="employee.email" name="email" placeholder="jean.dupont@entreprise.com">
        </div>
        
        <div class="form-group">
          <label class="form-label">Téléphone</label>
          <input type="text" class="form-control" [(ngModel)]="employee.phone" name="phone" placeholder="+33 6 12 34 56 78">
        </div>
      </div>
    </div>
    
    <hr class="section-divider">
    
    <div class="form-section">
      <h3 class="section-title">Informations Professionnelles</h3>
      
      <div class="form-grid">
        <div class="form-group">
          <label class="form-label">Département</label>
          <div class="select-wrapper">
            <select class="form-control" [(ngModel)]="employee.department" name="department">
              <option value="" disabled selected>Sélectionner un département</option>
              <option value="IT">Informatique (IT)</option>
              <option value="HR">Ressources Humaines</option>
              <option value="Marketing">Marketing</option>
              <option value="Sales">Ventes</option>
            </select>
            <svg class="select-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <polyline points="6 9 12 15 18 9"></polyline>
            </svg>
          </div>
        </div>
        
        <div class="form-group">
          <label class="form-label">Poste</label>
          <input type="text" class="form-control" [(ngModel)]="employee.job" name="job" placeholder="Ex: Développeur Fullstack">
        </div>
      </div>
    </div>

    <div class="form-actions">
      <button type="button" class="btn btn-secondary" routerLink="/employees">Annuler</button>
      <button type="submit" class="btn btn-primary">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" width="18" height="18">
          <path d="M19 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h11l5 5v11a2 2 0 0 1-2 2z"></path>
          <polyline points="17 21 17 13 7 13 7 21"></polyline>
          <polyline points="7 3 7 8 15 8"></polyline>
        </svg>
        Enregistrer l'employé
      </button>
    </div>
    
  </form>
</div>
