<div class="pro-max-page-wrapper">
  
  <!-- Premium Background Blobs -->
  <div class="blob-bg blob-1"></div>
  <div class="blob-bg blob-2"></div>
  <div class="blob-bg blob-3"></div>

  <div class="page-content" style="max-width: 800px; margin: 0 auto;">
    <div class="page-header animate-fade-in-down" style="margin-bottom: 2.5rem;">
      <div>
        <h1 class="page-title gradient-text">{{ isEditMode ? 'Modifier l\'Employé' : 'Nouvel Employé' }}</h1>
        <p class="page-subtitle">{{ isEditMode ? 'Mettre à jour les informations du collaborateur' : 'Ajouter un nouveau membre à l\'équipe' }}</p>
      </div>
      <div class="header-actions">
        <button class="glass-icon-btn" routerLink="/employees" style="width: auto; padding: 0 1rem; font-weight: 600;">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" width="16" height="16" style="margin-right: 0.5rem;">
            <line x1="19" y1="12" x2="5" y2="12"></line>
            <polyline points="12 19 5 12 12 5"></polyline>
          </svg>
          Retour
        </button>
      </div>
    </div>

    <div class="glass-card animate-slide-up" style="padding: 2.5rem;">
      <form (ngSubmit)="save()" class="form-layout">
        
        <div class="form-section" style="margin-bottom: 2rem;">
          <h3 class="section-title" style="font-size: 1.2rem; font-weight: 800; color: var(--slate-800); margin-bottom: 1.5rem; display: flex; align-items: center; gap: 0.5rem;">
            <div class="icon-sm bg-blue-glow" style="width: 32px; height: 32px; border-radius: 8px;">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" width="16" height="16">
                <path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"></path>
                <circle cx="12" cy="7" r="4"></circle>
              </svg>
            </div>
            Informations Personnelles
          </h3>
          
          <div class="form-grid" style="display: grid; grid-template-columns: 1fr 1fr; gap: 1.5rem;">
            <div class="form-group glass-input-wrapper">
              <label class="form-label" style="font-weight: 600; color: var(--slate-700); margin-bottom: 0.5rem; display: block;">Prénom</label>
              <input type="text" class="glass-form-control" [(ngModel)]="employee.firstname" name="firstname" placeholder="Ex: Jean">
            </div>
            
            <div class="form-group glass-input-wrapper">
              <label class="form-label" style="font-weight: 600; color: var(--slate-700); margin-bottom: 0.5rem; display: block;">Nom</label>
              <input type="text" class="glass-form-control" [(ngModel)]="employee.lastname" name="lastname" placeholder="Ex: Dupont">
            </div>
            
            <div class="form-group glass-input-wrapper" style="grid-column: span 2;">
              <label class="form-label" style="font-weight: 600; color: var(--slate-700); margin-bottom: 0.5rem; display: block;">Email</label>
              <input type="email" class="glass-form-control" [(ngModel)]="employee.email" name="email" placeholder="jean.dupont@entreprise.com">
            </div>
            
            <div class="form-group glass-input-wrapper" style="grid-column: span 2;">
              <label class="form-label" style="font-weight: 600; color: var(--slate-700); margin-bottom: 0.5rem; display: block;">Téléphone</label>
              <input type="text" class="glass-form-control" [(ngModel)]="employee.phone" name="phone" placeholder="+33 6 12 34 56 78">
            </div>
          </div>
        </div>
        
        <hr class="divider" style="border: none; border-top: 1px solid rgba(0,0,0,0.05); margin: 2rem 0;">
        
        <div class="form-section" style="margin-bottom: 3rem;">
          <h3 class="section-title" style="font-size: 1.2rem; font-weight: 800; color: var(--slate-800); margin-bottom: 1.5rem; display: flex; align-items: center; gap: 0.5rem;">
            <div class="icon-sm bg-cyan-glow" style="width: 32px; height: 32px; border-radius: 8px;">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" width="16" height="16">
                <rect x="2" y="7" width="20" height="14" rx="2" ry="2"></rect>
                <path d="M16 21V5a2 2 0 0 0-2-2h-4a2 2 0 0 0-2 2v16"></path>
              </svg>
            </div>
            Informations Professionnelles
          </h3>
          
          <div class="form-grid" style="display: grid; grid-template-columns: 1fr 1fr; gap: 1.5rem;">
            <div class="form-group glass-input-wrapper">
              <label class="form-label" style="font-weight: 600; color: var(--slate-700); margin-bottom: 0.5rem; display: block;">Département</label>
              <div class="select-wrapper">
                <select class="glass-form-control" [(ngModel)]="employee.department" name="department" style="appearance: none; width: 100%;">
                  <option value="" disabled selected>Sélectionner un département</option>
                  <option value="IT">Informatique (IT)</option>
                  <option value="HR">Ressources Humaines</option>
                  <option value="Marketing">Marketing</option>
                  <option value="Sales">Ventes</option>
                </select>
                <svg class="select-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" style="right: 1rem; left: auto;">
                  <polyline points="6 9 12 15 18 9"></polyline>
                </svg>
              </div>
            </div>
            
            <div class="form-group glass-input-wrapper">
              <label class="form-label" style="font-weight: 600; color: var(--slate-700); margin-bottom: 0.5rem; display: block;">Poste</label>
              <input type="text" class="glass-form-control" [(ngModel)]="employee.job" name="job" placeholder="Ex: Développeur Fullstack">
            </div>
          </div>
        </div>

        <div class="form-actions" style="display: flex; justify-content: flex-end; gap: 1rem; border-top: 1px solid rgba(0,0,0,0.05); padding-top: 2rem;">
          <button type="button" class="glass-icon-btn" routerLink="/employees" style="width: auto; padding: 0 1.5rem; font-weight: 600;">Annuler</button>
          <button type="submit" class="btn-premium">
            <span class="btn-glow"></span>
            <span class="btn-content">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" width="18" height="18">
                <path d="M19 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h11l5 5v11a2 2 0 0 1-2 2z"></path>
                <polyline points="17 21 17 13 7 13 7 21"></polyline>
                <polyline points="7 3 7 8 15 8"></polyline>
              </svg>
              Enregistrer l'employé
            </span>
          </button>
        </div>
        
      </form>
    </div>
  </div>
</div>
