<div class="pro-max-page-wrapper">
  
  <!-- Premium Background Blobs -->
  <div class="blob-bg blob-1"></div>
  <div class="blob-bg blob-2"></div>
  <div class="blob-bg blob-3"></div>

  <div class="page-content" style="max-width: 800px; margin: 0 auto;">
    <div class="page-header animate-fade-in-down" style="margin-bottom: 2.5rem;">
      <div>
        <h1 class="page-title gradient-text">{{ isEditMode ? 'Modifier l\'Utilisateur' : 'Nouvel Utilisateur' }}</h1>
        <p class="page-subtitle">{{ isEditMode ? 'Gérer les accès et permissions' : 'Ajouter un accès au système' }}</p>
      </div>
      <div class="header-actions">
        <button class="glass-icon-btn" routerLink="/users" style="width: auto; padding: 0 1rem; font-weight: 600;">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" width="16" height="16" style="margin-right: 0.5rem;">
            <line x1="19" y1="12" x2="5" y2="12"></line>
            <polyline points="12 19 5 12 12 5"></polyline>
          </svg>
          Retour
        </button>
      </div>
    </div>

    <div class="glass-card animate-slide-up" style="padding: 2.5rem;">
      <form (ngSubmit)="save()" class="form-layout">
        
        <div class="form-section" style="margin-bottom: 2rem;">
          <h3 class="section-title" style="font-size: 1.2rem; font-weight: 800; color: var(--slate-800); margin-bottom: 1.5rem; display: flex; align-items: center; gap: 0.5rem;">
            <div class="icon-sm bg-blue-glow" style="width: 32px; height: 32px; border-radius: 8px;">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" width="16" height="16">
                <path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"></path>
                <circle cx="12" cy="7" r="4"></circle>
              </svg>
            </div>
            Profil Utilisateur
          </h3>
          
          <div class="form-grid" style="display: grid; grid-template-columns: 1fr 1fr; gap: 1.5rem;">
            <div class="form-group glass-input-wrapper">
              <label class="form-label" style="font-weight: 600; color: var(--slate-700); margin-bottom: 0.5rem; display: block;">Prénom</label>
              <input type="text" class="glass-form-control" [(ngModel)]="user.firstname" name="firstname" placeholder="Ex: Jean">
            </div>
            
            <div class="form-group glass-input-wrapper">
              <label class="form-label" style="font-weight: 600; color: var(--slate-700); margin-bottom: 0.5rem; display: block;">Nom</label>
              <input type="text" class="glass-form-control" [(ngModel)]="user.lastname" name="lastname" placeholder="Ex: Dupont">
            </div>
            
            <div class="form-group glass-input-wrapper" style="grid-column: span 2;">
              <label class="form-label" style="font-weight: 600; color: var(--slate-700); margin-bottom: 0.5rem; display: block;">Email professionnel</label>
              <input type="email" class="glass-form-control" [(ngModel)]="user.email" name="email" placeholder="jean.dupont@entreprise.com">
            </div>
          </div>
        </div>
        
        <hr class="divider" style="border: none; border-top: 1px solid rgba(0,0,0,0.05); margin: 2rem 0;">
        
        <div class="form-section" style="margin-bottom: 3rem;">
          <h3 class="section-title" style="font-size: 1.2rem; font-weight: 800; color: var(--slate-800); margin-bottom: 1.5rem; display: flex; align-items: center; gap: 0.5rem;">
            <div class="icon-sm bg-purple-glow" style="width: 32px; height: 32px; border-radius: 8px;">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" width="16" height="16">
                <rect x="3" y="11" width="18" height="11" rx="2" ry="2"></rect>
                <path d="M7 11V7a5 5 0 0 1 10 0v4"></path>
              </svg>
            </div>
            Accès & Permissions
          </h3>
          
          <div class="form-grid">
            <div class="form-group">
              <label class="form-label" style="font-weight: 600; color: var(--slate-700); margin-bottom: 1rem; display: block;">Rôle système</label>
              
              <div class="role-cards" style="display: grid; grid-template-columns: repeat(auto-fit, minmax(180px, 1fr)); gap: 1rem;">
                
                <label class="role-card" [class.active]="user.role === 'ADMIN'" style="border: 2px solid transparent; border-radius: 12px; padding: 1rem; cursor: pointer; transition: all 0.3s ease; position: relative; overflow: hidden; background: rgba(255,255,255,0.5);" [ngStyle]="user.role === 'ADMIN' ? {'border-color': 'var(--indigo-500)', 'background': 'rgba(255,255,255,0.9)', 'box-shadow': '0 4px 12px rgba(99, 102, 241, 0.15)'} : {}">
                  <input type="radio" [(ngModel)]="user.role" name="role" value="ADMIN" style="display: none;">
                  <div class="role-icon bg-indigo-glow" style="width: 40px; height: 40px; border-radius: 10px; display: flex; align-items: center; justify-content: center; margin-bottom: 0.75rem;">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" width="20" height="20">
                      <path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"></path>
                    </svg>
                  </div>
                  <div class="role-info">
                    <span class="role-name" style="display: block; font-weight: 700; color: var(--slate-800); margin-bottom: 0.25rem;">Admin</span>
                    <span class="role-desc" style="font-size: 0.8rem; color: var(--slate-500);">Accès total au système</span>
                  </div>
                </label>
                
                <label class="role-card" [class.active]="user.role === 'HR'" style="border: 2px solid transparent; border-radius: 12px; padding: 1rem; cursor: pointer; transition: all 0.3s ease; position: relative; overflow: hidden; background: rgba(255,255,255,0.5);" [ngStyle]="user.role === 'HR' ? {'border-color': 'var(--emerald-500)', 'background': 'rgba(255,255,255,0.9)', 'box-shadow': '0 4px 12px rgba(16, 185, 129, 0.15)'} : {}">
                  <input type="radio" [(ngModel)]="user.role" name="role" value="HR" style="display: none;">
                  <div class="role-icon bg-emerald-glow" style="width: 40px; height: 40px; border-radius: 10px; display: flex; align-items: center; justify-content: center; margin-bottom: 0.75rem;">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" width="20" height="20">
                      <path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"></path>
                      <circle cx="9" cy="7" r="4"></circle>
                      <path d="M23 21v-2a4 4 0 0 0-3-3.87"></path>
                      <path d="M16 3.13a4 4 0 0 1 0 7.75"></path>
                    </svg>
                  </div>
                  <div class="role-info">
                    <span class="role-name" style="display: block; font-weight: 700; color: var(--slate-800); margin-bottom: 0.25rem;">RH</span>
                    <span class="role-desc" style="font-size: 0.8rem; color: var(--slate-500);">Gestion des employés</span>
                  </div>
                </label>
                
                <label class="role-card" [class.active]="user.role === 'MANAGER'" style="border: 2px solid transparent; border-radius: 12px; padding: 1rem; cursor: pointer; transition: all 0.3s ease; position: relative; overflow: hidden; background: rgba(255,255,255,0.5);" [ngStyle]="user.role === 'MANAGER' ? {'border-color': 'var(--cyan-500)', 'background': 'rgba(255,255,255,0.9)', 'box-shadow': '0 4px 12px rgba(6, 182, 212, 0.15)'} : {}">
                  <input type="radio" [(ngModel)]="user.role" name="role" value="MANAGER" style="display: none;">
                  <div class="role-icon bg-cyan-glow" style="width: 40px; height: 40px; border-radius: 10px; display: flex; align-items: center; justify-content: center; margin-bottom: 0.75rem;">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" width="20" height="20">
                      <polygon points="12 2 2 7 12 12 22 7 12 2"></polygon>
                      <polyline points="2 17 12 22 22 17"></polyline>
                      <polyline points="2 12 12 17 22 12"></polyline>
                    </svg>
                  </div>
                  <div class="role-info">
                    <span class="role-name" style="display: block; font-weight: 700; color: var(--slate-800); margin-bottom: 0.25rem;">Manager</span>
                    <span class="role-desc" style="font-size: 0.8rem; color: var(--slate-500);">Évaluation de l'équipe</span>
                  </div>
                </label>
                
                <label class="role-card" [class.active]="user.role === 'EMPLOYEE'" style="border: 2px solid transparent; border-radius: 12px; padding: 1rem; cursor: pointer; transition: all 0.3s ease; position: relative; overflow: hidden; background: rgba(255,255,255,0.5);" [ngStyle]="user.role === 'EMPLOYEE' ? {'border-color': 'var(--slate-500)', 'background': 'rgba(255,255,255,0.9)', 'box-shadow': '0 4px 12px rgba(100, 116, 139, 0.15)'} : {}">
                  <input type="radio" [(ngModel)]="user.role" name="role" value="EMPLOYEE" style="display: none;">
                  <div class="role-icon bg-slate-glow" style="width: 40px; height: 40px; border-radius: 10px; display: flex; align-items: center; justify-content: center; margin-bottom: 0.75rem;">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" width="20" height="20">
                      <path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"></path>
                      <circle cx="12" cy="7" r="4"></circle>
                    </svg>
                  </div>
                  <div class="role-info">
                    <span class="role-name" style="display: block; font-weight: 700; color: var(--slate-800); margin-bottom: 0.25rem;">Employé</span>
                    <span class="role-desc" style="font-size: 0.8rem; color: var(--slate-500);">Accès profil uniquement</span>
                  </div>
                </label>
                
              </div>
            </div>
          </div>
        </div>

        <div class="form-actions" style="display: flex; justify-content: flex-end; gap: 1rem; border-top: 1px solid rgba(0,0,0,0.05); padding-top: 2rem;">
          <button type="button" class="glass-icon-btn" routerLink="/users" style="width: auto; padding: 0 1.5rem; font-weight: 600;">Annuler</button>
          <button type="submit" class="btn-premium">
            <span class="btn-glow"></span>
            <span class="btn-content">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" width="18" height="18">
                <path d="M19 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h11l5 5v11a2 2 0 0 1-2 2z"></path>
                <polyline points="17 21 17 13 7 13 7 21"></polyline>
                <polyline points="7 3 7 8 15 8"></polyline>
              </svg>
              {{ isEditMode ? 'Mettre à jour' : 'Enregistrer' }}
            </span>
          </button>
        </div>
        
      </form>
    </div>
  </div>
</div>
