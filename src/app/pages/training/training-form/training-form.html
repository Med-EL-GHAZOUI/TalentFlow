<div class="page-header animate-fade-in">
  <div>
    <h1 class="page-title">Nouvelle Formation</h1>
    <p class="page-subtitle">Ajouter une session de formation au catalogue</p>
  </div>
  <div class="header-actions">
    <button class="btn btn-secondary" routerLink="/training">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" width="18" height="18">
        <line x1="19" y1="12" x2="5" y2="12"></line>
        <polyline points="12 19 5 12 12 5"></polyline>
      </svg>
      Retour
    </button>
  </div>
</div>

<div class="card animate-slide-up">
  <form (ngSubmit)="save()" class="form-layout">
    
    <div class="form-section">
      <h3 class="section-title">Informations Générales</h3>
      
      <div class="form-grid">
        <div class="form-group">
          <label class="form-label">Titre de la formation</label>
          <input type="text" class="form-control" [(ngModel)]="training.title" name="title" placeholder="Ex: Masterclass Leadership">
        </div>
        
        <div class="form-group">
          <label class="form-label">Organisme de formation</label>
          <input type="text" class="form-control" [(ngModel)]="training.provider" name="provider" placeholder="Ex: Coursera, Interne...">
        </div>
      </div>
    </div>
    
    <hr class="section-divider">
    
    <div class="form-section">
      <h3 class="section-title">Planification</h3>
      
      <div class="form-grid">
        <div class="form-group">
          <label class="form-label">Date de début</label>
          <input type="date" class="form-control" [(ngModel)]="training.startDate" name="startDate">
        </div>
        
        <div class="form-group">
          <label class="form-label">Date de fin</label>
          <input type="date" class="form-control" [(ngModel)]="training.endDate" name="endDate">
        </div>
        
        <div class="form-group">
          <label class="form-label">Durée (en heures)</label>
          <div class="input-with-suffix">
            <input type="number" class="form-control" [(ngModel)]="training.duration" name="duration" placeholder="Ex: 35">
            <span class="suffix">heures</span>
          </div>
        </div>
      </div>
    </div>

    <div class="form-actions">
      <button type="button" class="btn btn-secondary" routerLink="/training">Annuler</button>
      <button type="submit" class="btn btn-primary">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" width="18" height="18">
          <path d="M19 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h11l5 5v11a2 2 0 0 1-2 2z"></path>
          <polyline points="17 21 17 13 7 13 7 21"></polyline>
          <polyline points="7 3 7 8 15 8"></polyline>
        </svg>
        Planifier la formation
      </button>
    </div>
    
  </form>
</div>
