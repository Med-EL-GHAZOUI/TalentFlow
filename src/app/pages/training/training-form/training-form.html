<div class="pro-max-page-wrapper">
  
  <!-- Premium Background Blobs -->
  <div class="blob-bg blob-1"></div>
  <div class="blob-bg blob-2"></div>
  <div class="blob-bg blob-3"></div>

  <div class="page-content" style="max-width: 800px; margin: 0 auto;">
    <div class="page-header animate-fade-in-down" style="margin-bottom: 2.5rem;">
      <div>
        <h1 class="page-title gradient-text">{{ isEditMode ? 'Modifier la Formation' : 'Nouvelle Formation' }}</h1>
        <p class="page-subtitle">{{ isEditMode ? 'Mettre à jour les dates et détails de la session' : 'Ajouter une session de formation au catalogue' }}</p>
      </div>
      <div class="header-actions">
        <button class="glass-icon-btn" routerLink="/training" style="width: auto; padding: 0 1rem; font-weight: 600;">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" width="16" height="16" style="margin-right: 0.5rem;">
            <line x1="19" y1="12" x2="5" y2="12"></line>
            <polyline points="12 19 5 12 12 5"></polyline>
          </svg>
          Retour
        </button>
      </div>
    </div>

    <div class="glass-card animate-slide-up" style="padding: 2.5rem;">
      <form (ngSubmit)="save()" class="form-layout">
        
        <div class="form-section" style="margin-bottom: 2rem;">
          <h3 class="section-title" style="font-size: 1.2rem; font-weight: 800; color: var(--slate-800); margin-bottom: 1.5rem; display: flex; align-items: center; gap: 0.5rem;">
            <div class="icon-sm bg-blue-glow" style="width: 32px; height: 32px; border-radius: 8px;">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" width="16" height="16">
                <rect x="3" y="4" width="18" height="18" rx="2" ry="2"></rect>
                <line x1="16" y1="2" x2="16" y2="6"></line>
                <line x1="8" y1="2" x2="8" y2="6"></line>
                <line x1="3" y1="10" x2="21" y2="10"></line>
              </svg>
            </div>
            Informations Générales
          </h3>
          
          <div class="form-grid" style="display: grid; grid-template-columns: 1fr 1fr; gap: 1.5rem;">
            <div class="form-group glass-input-wrapper">
              <label class="form-label" style="font-weight: 600; color: var(--slate-700); margin-bottom: 0.5rem; display: block;">Titre de la formation</label>
              <input type="text" class="glass-form-control" [(ngModel)]="training.title" name="title" placeholder="Ex: Masterclass Leadership">
            </div>
            
            <div class="form-group glass-input-wrapper">
              <label class="form-label" style="font-weight: 600; color: var(--slate-700); margin-bottom: 0.5rem; display: block;">Organisme de formation</label>
              <input type="text" class="glass-form-control" [(ngModel)]="training.provider" name="provider" placeholder="Ex: Coursera, Interne...">
            </div>
            
            <div class="form-group glass-input-wrapper" style="grid-column: 1 / -1;">
              <label class="form-label" style="font-weight: 600; color: var(--slate-700); margin-bottom: 0.5rem; display: block;">Compétence Ciblée (GPEC)</label>
              <select class="glass-form-control" [(ngModel)]="training.targetSkillId" name="targetSkillId">
                <option [ngValue]="null">Aucune compétence spécifique</option>
                <option *ngFor="let skill of skills" [ngValue]="skill.id">{{ skill.name }}</option>
              </select>
            </div>
          </div>
        </div>
        
        <hr class="divider" style="border: none; border-top: 1px solid rgba(0,0,0,0.05); margin: 2rem 0;">
        
        <div class="form-section" style="margin-bottom: 3rem;">
          <h3 class="section-title" style="font-size: 1.2rem; font-weight: 800; color: var(--slate-800); margin-bottom: 1.5rem; display: flex; align-items: center; gap: 0.5rem;">
            <div class="icon-sm bg-emerald-glow" style="width: 32px; height: 32px; border-radius: 8px;">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" width="16" height="16">
                <circle cx="12" cy="12" r="10"></circle>
                <polyline points="12 6 12 12 16 14"></polyline>
              </svg>
            </div>
            Planification
          </h3>
          
          <div class="form-grid" style="display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 1.5rem;">
            <div class="form-group glass-input-wrapper">
              <label class="form-label" style="font-weight: 600; color: var(--slate-700); margin-bottom: 0.5rem; display: block;">Date de début</label>
              <input type="date" class="glass-form-control" [(ngModel)]="training.startDate" name="startDate">
            </div>
            
            <div class="form-group glass-input-wrapper">
              <label class="form-label" style="font-weight: 600; color: var(--slate-700); margin-bottom: 0.5rem; display: block;">Date de fin</label>
              <input type="date" class="glass-form-control" [(ngModel)]="training.endDate" name="endDate">
            </div>
            
            <div class="form-group glass-input-wrapper">
              <label class="form-label" style="font-weight: 600; color: var(--slate-700); margin-bottom: 0.5rem; display: block;">Durée</label>
              <div class="input-with-suffix" style="position: relative; display: flex; align-items: center;">
                <input type="number" class="glass-form-control" [(ngModel)]="training.duration" name="duration" placeholder="Ex: 35" style="padding-right: 4rem;">
                <span class="suffix" style="position: absolute; right: 1rem; color: var(--slate-500); font-weight: 500;">heures</span>
              </div>
            </div>
          </div>
        </div>

        <div class="form-actions" style="display: flex; justify-content: flex-end; gap: 1rem; border-top: 1px solid rgba(0,0,0,0.05); padding-top: 2rem;">
          <button type="button" class="glass-icon-btn" routerLink="/training" style="width: auto; padding: 0 1.5rem; font-weight: 600;">Annuler</button>
          <button type="submit" class="btn-premium">
            <span class="btn-glow"></span>
            <span class="btn-content">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" width="18" height="18">
                <path d="M19 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h11l5 5v11a2 2 0 0 1-2 2z"></path>
                <polyline points="17 21 17 13 7 13 7 21"></polyline>
                <polyline points="7 3 7 8 15 8"></polyline>
              </svg>
              {{ isEditMode ? 'Mettre à jour' : 'Planifier' }}
            </span>
          </button>
        </div>
        
      </form>
    </div>
  </div>
</div>
