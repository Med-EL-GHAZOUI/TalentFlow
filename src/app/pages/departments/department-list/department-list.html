<h2>Liste des départements</h2>

<table>

  <thead>

  <tr>

    <th>ID</th>

    <th>Nom</th>

    <th>Responsable</th>

    <th>Actions</th>

  </tr>

  </thead>

  <tbody>

  @for (department of departments; track department.id) {

    <tr>

      <td>{{ department.id }}</td>

      <td>{{ department.name }}</td>

      <td>{{ department.manager }}</td>

      <td>

        <button>Modifier</button>

        <button>Supprimer</button>

      </td>

    </tr>

  }

  </tbody>

</table>
