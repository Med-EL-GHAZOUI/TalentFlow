<div class="page-header animate-fade-in">
  <div>
    <h1 class="page-title">Nouvelle Compétence</h1>
    <p class="page-subtitle">Ajouter une compétence au référentiel de l'entreprise</p>
  </div>
  <div class="header-actions">
    <button class="btn btn-secondary" routerLink="/skills">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" width="18" height="18">
        <line x1="19" y1="12" x2="5" y2="12"></line>
        <polyline points="12 19 5 12 12 5"></polyline>
      </svg>
      Retour
    </button>
  </div>
</div>

<div class="card animate-slide-up">
  <form (ngSubmit)="save()" class="form-layout">
    
    <div class="form-section">
      <h3 class="section-title">Informations de la Compétence</h3>
      
      <div class="form-grid">
        <div class="form-group">
          <label class="form-label">Nom de la compétence</label>
          <input type="text" class="form-control" [(ngModel)]="skill.name" name="name" placeholder="Ex: React.js">
        </div>
        
        <div class="form-group">
          <label class="form-label">Catégorie</label>
          <div class="select-wrapper">
            <select class="form-control" [(ngModel)]="skill.category" name="category">
              <option value="" disabled selected>Sélectionner une catégorie</option>
              <option value="Frontend">Frontend</option>
              <option value="Backend">Backend</option>
              <option value="DevOps">DevOps</option>
              <option value="Design">Design</option>
              <option value="Management">Management</option>
            </select>
            <svg class="select-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <polyline points="6 9 12 15 18 9"></polyline>
            </svg>
          </div>
        </div>
      </div>
      
      <div class="form-group" style="margin-top: 1.5rem;">
        <label class="form-label">Niveau d'expertise cible</label>
        <div class="level-selector">
          <div class="range-wrapper">
            <input type="range" min="1" max="5" [(ngModel)]="skill.level" name="level" class="range-slider">
            <div class="range-labels">
              <span>1</span>
              <span>2</span>
              <span>3</span>
              <span>4</span>
              <span>5</span>
            </div>
          </div>
          <div class="level-display">
            Niveau <strong>{{ skill.level }}</strong>
          </div>
        </div>
      </div>
      
      <div class="form-group" style="margin-top: 1.5rem;">
        <label class="form-label">Description et critères d'évaluation</label>
        <textarea class="form-control" rows="4" [(ngModel)]="skill.description" name="description" placeholder="Détaillez ce qui est attendu pour cette compétence..."></textarea>
      </div>
    </div>

    <div class="form-actions">
      <button type="button" class="btn btn-secondary" routerLink="/skills">Annuler</button>
      <button type="submit" class="btn btn-primary">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" width="18" height="18">
          <path d="M19 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h11l5 5v11a2 2 0 0 1-2 2z"></path>
          <polyline points="17 21 17 13 7 13 7 21"></polyline>
          <polyline points="7 3 7 8 15 8"></polyline>
        </svg>
        Enregistrer la compétence
      </button>
    </div>
    
  </form>
</div>
