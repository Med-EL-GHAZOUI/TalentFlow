<div class="page-header animate-fade-in">
  <div>
    <h1 class="page-title">Postes</h1>
    <p class="page-subtitle">Gérez le catalogue des emplois et fiches de poste ({{ jobs.length }} au total)</p>
  </div>
  <div class="header-actions">
    <button class="btn btn-primary" routerLink="/jobs/new">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" width="18" height="18">
        <line x1="12" y1="5" x2="12" y2="19"></line>
        <line x1="5" y1="12" x2="19" y2="12"></line>
      </svg>
      Nouveau poste
    </button>
  </div>
</div>

<div class="card table-card animate-slide-up">
  <div class="table-toolbar">
    <div class="search-box">
      <svg class="search-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
        <circle cx="11" cy="11" r="8"></circle>
        <line x1="21" y1="21" x2="16.65" y2="16.65"></line>
      </svg>
      <input type="text" class="form-control" placeholder="Rechercher un poste...">
    </div>
  </div>

  <div class="table-responsive">
    <table class="data-table">
      <thead>
        <tr>
          <th>Titre du poste</th>
          <th>Département</th>
          <th>Statut</th>
          <th class="actions-col">Actions</th>
        </tr>
      </thead>
      <tbody>
        @for(job of jobs; track job.id){
          <tr>
            <td>
              <div class="item-cell">
                <div class="icon-sm bg-amber">
                  <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" width="16" height="16">
                    <rect x="2" y="7" width="20" height="14" rx="2" ry="2"></rect>
                    <path d="M16 21V5a2 2 0 0 0-2-2h-4a2 2 0 0 0-2 2v16"></path>
                  </svg>
                </div>
                <div class="item-info">
                  <span class="item-name">{{ job.title }}</span>
                  <span class="item-desc">ID: JOB-{{ job.id.toString().padStart(3, '0') }}</span>
                </div>
              </div>
            </td>
            <td>
              <span class="badge badge-info">{{ job.department }}</span>
            </td>
            <td>
              <span class="badge badge-success">Ouvert</span>
            </td>
            <td class="actions-cell">
              <div class="action-buttons">
                <button class="action-btn edit" title="Modifier">
                  <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                    <path d="M11 4H4a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2v-7"></path>
                    <path d="M18.5 2.5a2.121 2.121 0 0 1 3 3L12 15l-4 1 1-4 9.5-9.5z"></path>
                  </svg>
                </button>
                <button class="action-btn delete" title="Supprimer">
                  <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                    <polyline points="3 6 5 6 21 6"></polyline>
                    <path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"></path>
                    <line x1="10" y1="11" x2="10" y2="17"></line>
                    <line x1="14" y1="11" x2="14" y2="17"></line>
                  </svg>
                </button>
              </div>
            </td>
          </tr>
        }
      </tbody>
    </table>
  </div>
</div>
