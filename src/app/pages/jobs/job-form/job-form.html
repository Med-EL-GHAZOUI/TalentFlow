<div class="page-header animate-fade-in">
  <div>
    <h1 class="page-title">Nouveau Poste</h1>
    <p class="page-subtitle">Créer une nouvelle fiche de poste au catalogue</p>
  </div>
  <div class="header-actions">
    <button class="btn btn-secondary" routerLink="/jobs">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" width="18" height="18">
        <line x1="19" y1="12" x2="5" y2="12"></line>
        <polyline points="12 19 5 12 12 5"></polyline>
      </svg>
      Retour
    </button>
  </div>
</div>

<div class="card animate-slide-up">
  <form (ngSubmit)="save()" class="form-layout">
    
    <div class="form-section">
      <h3 class="section-title">Informations du Poste</h3>
      
      <div class="form-grid">
        <div class="form-group">
          <label class="form-label">Titre du poste</label>
          <input type="text" class="form-control" [(ngModel)]="job.title" name="title" placeholder="Ex: Lead Développeur Angular">
        </div>
        
        <div class="form-group">
          <label class="form-label">Département de rattachement</label>
          <div class="select-wrapper">
            <select class="form-control" [(ngModel)]="job.department" name="department">
              <option value="" disabled selected>Sélectionner un département</option>
              <option value="IT">Informatique (IT)</option>
              <option value="HR">Ressources Humaines</option>
              <option value="Marketing">Marketing</option>
              <option value="Sales">Ventes</option>
            </select>
            <svg class="select-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <polyline points="6 9 12 15 18 9"></polyline>
            </svg>
          </div>
        </div>
      </div>
      
      <div class="form-group" style="margin-top: 1.5rem;">
        <label class="form-label">Description des missions</label>
        <textarea class="form-control" rows="6" [(ngModel)]="job.description" name="description" placeholder="Décrivez les principales missions, responsabilités et activités du poste..."></textarea>
      </div>
    </div>

    <div class="form-actions">
      <button type="button" class="btn btn-secondary" routerLink="/jobs">Annuler</button>
      <button type="submit" class="btn btn-primary">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" width="18" height="18">
          <path d="M19 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h11l5 5v11a2 2 0 0 1-2 2z"></path>
          <polyline points="17 21 17 13 7 13 7 21"></polyline>
          <polyline points="7 3 7 8 15 8"></polyline>
        </svg>
        Enregistrer le poste
      </button>
    </div>
    
  </form>
</div>
